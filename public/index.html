<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <title>首程助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z"/></svg>
      </span>
      <span class="brand-name">首程助手</span>
      <span class="model" id="model" title="当前模型"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="功能">
      <button role="tab" data-task="history" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg>
        <span>病史生成</span>
      </button>
      <button role="tab" data-task="features" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
        <span>病历特点</span>
      </button>
      <button role="tab" data-task="differential" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6v5H4zM14 13h6v5h-6zM10 8.5h2a2 2 0 0 1 2 2V13"/></svg>
        <span>鉴别诊断</span>
      </button>
    </nav>
  </header>

  <main class="workspace">
    <section class="card input-card" aria-labelledby="input-title">
      <div class="card-head">
        <div>
          <h2 id="input-title"></h2>
          <p class="hint" id="input-hint"></p>
        </div>
        <button class="btn ghost small" id="btn-example" type="button">填入示例</button>
      </div>

      <label class="field" id="diag-field" hidden>
        <span class="field-label">初步诊断</span>
        <input id="diagnosis" type="text" maxlength="500" autocomplete="off" placeholder="如：左乳浸润性导管癌（可补充：需鉴别纤维腺瘤、囊肿）">
      </label>

      <label class="field grow">
        <span class="field-label" id="input-label"></span>
        <textarea id="input" spellcheck="false"></textarea>
        <span class="counter" id="counter">0 / 8000</span>
      </label>

      <div class="actions">
        <button class="btn ghost" id="btn-clear" type="button">清空</button>
        <button class="btn primary" id="btn-generate" type="button">
          <span class="btn-label">生成</span>
        </button>
      </div>
    </section>

    <section class="card output-card" aria-labelledby="output-title" aria-live="polite">
      <div class="card-head">
        <h2 id="output-title">输出</h2>
        <div class="out-tools">
          <button class="btn ghost small" id="btn-regen" type="button" disabled>重新生成</button>
          <button class="btn ghost small" id="btn-copy" type="button" disabled>复制</button>
        </div>
      </div>
      <div class="output" id="output">
        <div class="empty" id="empty">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="6" width="28" height="36" rx="4"/><path d="M17 16h14M17 23h14M17 30h9"/></svg>
          <p><span class="d">在左侧</span><span class="m">在上方</span>输入内容后点击"生成"</p>
        </div>
        <div class="md" id="md"></div>
      </div>
      <div class="error" id="error" hidden></div>
      <div class="chain" id="chain" hidden></div>
    </section>
  </main>

  <footer class="disclaimer">AI 生成内容仅供参考，须经执业医师审核后方可写入病历。服务器不保存您输入的任何内容。</footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
